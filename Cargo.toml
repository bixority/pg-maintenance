[package]
name = "pg-maintenance"
version = "0.1.5"
edition = "2024"

[dependencies]
sqlx = { version = "0.9.0", features = ["postgres", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
anyhow = "1.0.104"
chrono = "0.4.45"
log = "0.4.33"
env_logger = "0.11.11"

[profile.dev]
debug = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.release.package."*"]
codegen-units = 1
debug = false
opt-level = 3
strip = true
